name: Refresh results

# Runs the ingest here and writes straight into Cloudflare KV, so the Worker
# never has to do it. That is what keeps the whole stack on free tiers:
# Workers' free plan allows 10 ms of CPU per invocation and this ingest costs
# well over 100 ms, but reading a value out of KV — all the Worker does in this
# mode — is far below the ceiling.
#
# This repo is public, so Actions minutes are unlimited and the cadence is set
# by what the data actually does rather than by budget. Five minutes is the
# shortest GitHub allows and matches how fast counties report on election
# night; dial it back to hourly ('0 * * * *') once results certify, since a run
# that finds nothing changed still costs an upstream request.
#
# Two GitHub behaviours worth knowing: scheduled runs are best-effort and get
# delayed under load, and GitHub disables schedules after 60 days without repo
# activity. Neither matters for a run-up to an election; both matter if this
# sits idle for months.
#
# Required secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
# The token needs Workers KV Storage: Edit.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-ingest even if upstream asOf has not changed'
        type: boolean
        default: false

# Scheduled runs can bunch up if one is slow; never let two write KV at once.
concurrency:
  group: refresh-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the ingest needs only the committed county index and
      # Node's built-in fetch, so skipping install keeps each billed run short.
      - name: Push results to KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/push-to-kv.mjs ${{ inputs.force && '--force' || '' }}
